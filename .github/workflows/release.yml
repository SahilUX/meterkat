name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APKs
        working-directory: Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          METERKAT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          METERKAT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          METERKAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          METERKAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          trap 'rm "$METERKAT_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$METERKAT_KEYSTORE_PATH"
          chmod 600 "$METERKAT_KEYSTORE_PATH"
          ./gradlew testDebugUnitTest lintDebug :app:assembleRelease :wear:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify wear/build/outputs/apk/release/wear-release.apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp Android/app/build/outputs/apk/release/app-release.apk release-assets/Meterkat-android.apk
          cp Android/wear/build/outputs/apk/release/wear-release.apk release-assets/Meterkat-wear.apk
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --verify-tag --title "Meterkat $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
