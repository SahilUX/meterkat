name: Home Assistant
on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'tests/ha_meterkat/**', 'hacs.json', '.github/workflows/home-assistant.yml']
  pull_request:
    paths: ['custom_components/**', 'tests/ha_meterkat/**', 'hacs.json', '.github/workflows/home-assistant.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/ha_meterkat/requirements.txt
      - run: pip install -r tests/ha_meterkat/requirements.txt
      - run: pytest
        working-directory: tests/ha_meterkat
